name: Test on Push

on:
    push:
      branches:
        - '**'

jobs:
  test-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Zip dist folder
        run: |
          zip -r dist.zip dist
          ls -lh dist.zip # List the zip file to verify

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.zip
