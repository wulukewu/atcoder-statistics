name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check if gh-pages branch exists
        id: check-branch
        run: |
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create gh-pages branch if it doesn't exist
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          git commit --allow-empty -m "Initial commit for gh-pages - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin gh-pages
          git checkout main

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Backup pr-preview directory
        run: |
          if [ -d "gh-pages/pr-preview" ]; then
            mv gh-pages/pr-preview /tmp/pr-preview-backup
          fi

      - name: Copy files to gh-pages branch
        run: |
          # Remove old files
          for file in $(ls gh-pages/ | grep -v pr-preview | grep -v .git); do
            rm -rf "gh-pages/$file"
          done
          # Copy built React app
          cp -r dist/* gh-pages/
          # Copy static assets
          mkdir -p gh-pages/web-page
          cp -r web-page/styles.css web-page/styles-list.css web-page/atcoder-problems-logo.png web-page/favicon.svg gh-pages/web-page/ 2>/dev/null || true

      - name: Restore pr-preview directory
        run: |
          if [ -d "/tmp/pr-preview-backup" ]; then
            mkdir -p gh-pages/pr-preview
            mv /tmp/pr-preview-backup/* gh-pages/pr-preview/
          fi

      - name: Commit and push changes
        run: |
          cd gh-pages
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update website content"
            git push origin gh-pages
          fi
          git remote set-url origin https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git
          git push
